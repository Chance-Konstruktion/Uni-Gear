name: Host-free geometry tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run host-free geometry regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify packaged add-on matches source
        run: python build_addon_zip.py --check
